<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tajemný terminál</title>
    <style>
        body {
            background-color: #111;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        h1 { margin-bottom: 5px; text-shadow: 0 0 5px #0f0; }
        p { margin-bottom: 20px; max-width: 400px; text-align: center; }
        #game-board {
            display: grid;
            grid-template-columns: repeat(5, 50px);
            gap: 5px;
            margin-bottom: 30px;
        }
        .cell {
            width: 50px;
            height: 50px;
            background-color: #222;
            border: 1px solid #0f0;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cell.on {
            background-color: #0f0;
            box-shadow: 0 0 15px #0f0;
        }
        #result {
            display: none;
            text-align: center;
            font-size: 1.2em;
            background: #000;
            padding: 20px;
            border: 2px dashed #0f0;
            border-radius: 10px;
        }
        .value-box {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <h1>TERMINÁL UZAMČEN</h1>
    <p>Pro získání přístupových kódů zhasni všechna světla na panelu. Kliknutím přepneš stav buňky a jejích sousedů.</p>

    <div id="game-board"></div>

    <div id="result">
        <div>SYSTÉM ODBLOKOVÁN. DEŠIFRUJI KÓDY...</div>
        <div class="value-box" id="final-values"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
